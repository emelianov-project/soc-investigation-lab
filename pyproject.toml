[project]
name = "soc-investigation-lab"
version = "0.2.0"
description = "Hands-on SOC investigation lab for Windows and Sysmon alert triage, detection engineering, incident analysis, MITRE ATT&CK mapping, and escalation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "emelianov-project" },
]
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
    "types-PyYAML>=6.0.12",
]
test = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["backend"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = [
    "backend/tests",
    "tests/integration",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
